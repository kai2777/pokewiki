<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#df4c51">
  <meta name="description" content="PokéWiki — 非官方寶可夢互動圖鑑，搜尋第一世代寶可夢、查看屬性、六項能力值與進化路線。">
  <title>PokéWiki｜寶可夢互動圖鑑</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="shell nav-inner">
      <a class="brand" href="./index.html" aria-label="PokéWiki 首頁">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>Poké<span class="brand-accent">Wiki</span></span>
      </a>
      <nav class="header-links" aria-label="主選單">
        <a href="#catalog-title">探索圖鑑</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="shell hero-content">
        <div class="hero-copy">
          <h1><span>寶可夢</span>圖鑑</h1>
          <p>搜尋第一世代寶可夢，查看屬性、能力值與進化路線。</p>
          <div class="hero-actions">
            <a class="primary-btn" href="#catalog-title">開始探索 <span aria-hidden="true">↗</span></a>
            <span id="range-label" class="hero-range"></span>
          </div>
        </div>
        <div class="hero-decoration" aria-hidden="true">
          <div class="orb orb-back"></div><div class="orb orb-front"><span class="orb-center"></span></div>
          <span class="hero-spark spark-one">✦</span><span class="hero-spark spark-two">✦</span><span class="hero-spark spark-three">✧</span>
        </div>
      </div>
    </section>

    <section class="catalog-section shell" aria-labelledby="catalog-title">
      <div class="section-heading">
        <div>
          <h2 id="catalog-title">寶可夢列表</h2>
        </div>
        <span class="collection-mark" id="generation-label">第一世代 · 關都</span>
      </div>

      <div class="filter-panel">
        <label class="search-field" for="search">
          <span class="field-label">搜尋寶可夢</span>
          <span class="field-control"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="輸入中文、英文名稱或圖鑑編號…" autocomplete="off"></span>
        </label>
        <label class="type-field" for="type-filter">
          <span class="field-label">屬性篩選</span>
          <span class="field-control"><select id="type-filter"><option value="all">全部屬性</option></select></span>
        </label>
      </div>

      <div class="results-row">
        <p id="status" role="status" aria-live="polite">準備載入圖鑑…</p>
        <a id="online-catalog" href="https://kai2777.github.io/pokewiki/" hidden>開啟線上圖鑑</a>
        <button id="retry" class="retry-btn" type="button" hidden>重新載入</button>
      </div>
      <div id="pokemon-grid" class="pokemon-grid" aria-label="寶可夢列表"></div>
      <nav id="pagination" class="pagination" aria-label="圖鑑頁碼"></nav>
    </section>

  </main>

  <dialog id="detail-dialog" aria-label="寶可夢詳細資訊">
    <div class="dialog-bar"><span>PokéWiki · 寶可夢詳細資料</span><button id="close-detail" class="close-btn" type="button" aria-label="關閉詳細資料">✕</button></div>
    <div id="detail-content" aria-live="polite"></div>
  </dialog>

  <footer class="footer">
    <div class="shell footer-inner">
      <span><strong>PokéWiki</strong> · 非官方、非商業教育作品</span>
      <span>資料：<a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a> · 寶可夢角色、名稱及圖像權利屬其各自權利人。</span>
    </div>
  </footer>
  <script defer src="./js/config.js"></script>
  <script defer src="./js/api.js"></script>
  <script defer src="./js/ui.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
